<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竹緣開運竹 · 營業報表</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

  :root {
    --green:    #2D6A4F;
    --green2:   #40916C;
    --green3:   #D8F3DC;
    --bg:       #F8FAF8;
    --surface:  #FFFFFF;
    --border:   #E0EBE3;
    --ink:      #1B2B1E;
    --ink2:     #4A6450;
    --ink3:     #8AA890;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  /* Header */
  header {
    background: var(--green);
    color: white;
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 12px rgba(45,106,79,0.3);
  }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  header p  { font-size: 13px; opacity: 0.8; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .year-select {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  .year-select option { background: var(--green); }
  .reload-btn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    padding: 6px 16px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .reload-btn:hover { background: rgba(255,255,255,0.25); }

  /* Layout */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 24px 48px;
  }

  /* Cards */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .stat-card .label { font-size: 12px; color: var(--ink3); margin-bottom: 8px; }
  .stat-card .value { font-size: 28px; font-weight: 700; color: var(--green); }
  .stat-card .sub   { font-size: 13px; color: var(--ink2); margin-top: 4px; }

  /* Grid */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .grid-1 { margin-bottom: 20px; }

  /* Section */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .section-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 14px;
    color: var(--ink);
    background: var(--bg);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-header span { font-size: 16px; }

  /* Table */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    padding: 10px 16px;
    text-align: left;
    font-size: 12px;
    color: var(--ink3);
    font-weight: 500;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  th.right, td.right { text-align: right; }
  td {
    padding: 11px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--ink);
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--green3); transition: background 0.15s; }

  .rank { color: var(--ink3); font-size: 12px; margin-right: 8px; min-width: 20px; display: inline-block; text-align: right; }
  .rank-1 { color: #B7791F; font-weight: 700; }
  .rank-2 { color: #718096; font-weight: 700; }
  .rank-3 { color: #9C4221; font-weight: 700; }

  .amount { font-weight: 600; color: var(--green2); }
  .month-bar {
    display: inline-block;
    height: 8px;
    background: var(--green3);
    border-radius: 4px;
    margin-left: 8px;
    vertical-align: middle;
    transition: width 0.4s ease;
  }
  .month-bar-fill {
    height: 100%;
    background: var(--green2);
    border-radius: 4px;
  }

  /* Loading / Empty */
  .loading {
    padding: 40px;
    text-align: center;
    color: var(--ink3);
    font-size: 14px;
  }
  .dot-anim::after {
    content: '';
    animation: dots 1.2s infinite;
  }
  @keyframes dots {
    0%   { content: ''; }
    33%  { content: '.'; }
    66%  { content: '..'; }
    100% { content: '...'; }
  }

  /* Badge */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    background: var(--green3);
    color: var(--green);
  }

  @media (max-width: 768px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .grid-2    { grid-template-columns: 1fr; }
    main { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>竹緣開運竹</h1>
    <p>營業報表系統</p>
  </div>
  <div class="header-right">
    <select class="year-select" id="year-select" onchange="filterYear()">
      <option value="all">全部年份</option>
    </select>
    <button class="reload-btn" onclick="loadReport()">↻ 重新載入</button>
  </div>
</header>

<main>
  <div id="report-area">
    <div class="loading dot-anim">載入中</div>
  </div>
</main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbybC0nhwz_ELXYt-bWgG7V-Y8TTgtwW1pMTdy96JhI3ORYSjVuNC2chd0aze9QXUIw/exec';

let reportData = null;

async function loadReport() {
  const area = document.getElementById('report-area');
  area.innerHTML = '<div class="loading dot-anim">載入中</div>';

  try {
    const r = await fetch(API_URL + '?action=getReport');
    reportData = await r.json();
    if (reportData.error) throw new Error(reportData.error);

    // 填充年份選單
    const years = [...new Set(reportData.monthly.map(m => m.month.slice(0,4)))].sort().reverse();
    const sel = document.getElementById('year-select');
    sel.innerHTML = '<option value="all">全部年份</option>';
    years.forEach(y => {
      const opt = document.createElement('option');
      opt.value = y; opt.textContent = y + ' 年';
      sel.appendChild(opt);
    });

    renderReport('all');
  } catch(e) {
    area.innerHTML = '<div class="loading">載入失敗：' + e.message + '</div>';
  }
}

function filterYear() {
  const year = document.getElementById('year-select').value;
  renderReport(year);
}

function renderReport(year) {
  if (!reportData) return;
  const area = document.getElementById('report-area');

  // 篩選月份
  const monthly = year === 'all'
    ? reportData.monthly
    : reportData.monthly.filter(m => m.month.startsWith(year));

  // 年度統計
  const yearly = year === 'all'
    ? reportData.yearly
    : reportData.yearly.filter(y => y.year === year);

  const totalAmount = monthly.reduce((s, m) => s + m.amount, 0);
  const totalOrders = monthly.reduce((s, m) => s + m.count, 0);
  const avgOrder    = totalOrders > 0 ? Math.round(totalAmount / totalOrders) : 0;
  const maxMonth    = monthly.length > 0 ? Math.max(...monthly.map(m => m.amount)) : 1;

  // 熱銷和客戶需要重新從完整資料取（不篩年）
  const products  = reportData.products;
  const customers = reportData.customers;

  let html = '';

  // 統計卡片
  html += '<div class="stats-row">';
  html += statCard('總營業額', '$' + totalAmount.toLocaleString(), year === 'all' ? '全部期間' : year + ' 年');
  html += statCard('總訂單數', totalOrders + ' 筆', year === 'all' ? '全部期間' : year + ' 年');
  html += statCard('平均客單價', '$' + avgOrder.toLocaleString(), '每筆訂單平均');
  html += statCard('活躍月份', monthly.filter(m => m.count > 0).length + ' 個月', '有訂單的月份');
  html += '</div>';

  // 月營業額 + 年度統計
  html += '<div class="grid-2">';

  // 月營業額
  html += '<div class="section">';
  html += '<div class="section-header"><span>📅</span>每月營業額</div>';
  html += '<table><thead><tr><th>月份</th><th class="right">營業額</th><th class="right">訂單數</th><th>趨勢</th></tr></thead><tbody>';
  monthly.forEach(function(m) {
    const barPct = maxMonth > 0 ? Math.round((m.amount / maxMonth) * 100) : 0;
    html += '<tr>';
    html += '<td>' + m.month + '</td>';
    html += '<td class="right amount">$' + m.amount.toLocaleString() + '</td>';
    html += '<td class="right">' + m.count + ' 筆</td>';
    html += '<td><div class="month-bar" style="width:80px;"><div class="month-bar-fill" style="width:' + barPct + '%;"></div></div></td>';
    html += '</tr>';
  });
  if (!monthly.length) html += '<tr><td colspan="4" style="text-align:center;color:var(--ink3);padding:24px;">無資料</td></tr>';
  html += '</tbody></table></div>';

  // 年度統計
  html += '<div class="section">';
  html += '<div class="section-header"><span>📆</span>年度統計</div>';
  html += '<table><thead><tr><th>年份</th><th class="right">營業額</th><th class="right">訂單數</th></tr></thead><tbody>';
  reportData.yearly.forEach(function(y) {
    html += '<tr>';
    html += '<td><span class="badge">' + y.year + '</span></td>';
    html += '<td class="right amount">$' + y.amount.toLocaleString() + '</td>';
    html += '<td class="right">' + y.count + ' 筆</td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  html += '</div>'; // grid-2

  // 熱銷商品 + 客戶排行
  html += '<div class="grid-2">';

  html += '<div class="section">';
  html += '<div class="section-header"><span>🏆</span>熱銷商品 Top 10</div>';
  html += '<table><thead><tr><th>商品</th><th class="right">數量</th><th class="right">金額</th></tr></thead><tbody>';
  products.forEach(function(p, i) {
    const rankClass = i < 3 ? 'rank-' + (i+1) : '';
    html += '<tr>';
    html += '<td><span class="rank ' + rankClass + '">' + (i+1) + '</span>' + p.name + '</td>';
    html += '<td class="right">' + p.qty + ' 盆</td>';
    html += '<td class="right amount">$' + p.amount.toLocaleString() + '</td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';

  html += '<div class="section">';
  html += '<div class="section-header"><span>👑</span>客戶消費排行 Top 10</div>';
  html += '<table><thead><tr><th>客戶</th><th class="right">消費額</th><th class="right">訂單數</th></tr></thead><tbody>';
  customers.forEach(function(c, i) {
    const rankClass = i < 3 ? 'rank-' + (i+1) : '';
    html += '<tr>';
    html += '<td><span class="rank ' + rankClass + '">' + (i+1) + '</span>' + c.name + '</td>';
    html += '<td class="right amount">$' + c.amount.toLocaleString() + '</td>';
    html += '<td class="right">' + c.count + ' 筆</td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  html += '</div>'; // grid-2

  area.innerHTML = html;
}

function statCard(label, value, sub) {
  return '<div class="stat-card"><div class="label">' + label + '</div><div class="value">' + value + '</div><div class="sub">' + sub + '</div></div>';
}

// 頁面載入時自動讀取
loadReport();
</script>
</body>
</html>
