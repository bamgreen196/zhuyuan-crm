<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竹緣開運竹 · 營業報表</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

  :root {
    --green:    #2D6A4F;
    --green2:   #40916C;
    --green3:   #D8F3DC;
    --bg:       #F8FAF8;
    --surface:  #FFFFFF;
    --border:   #E0EBE3;
    --ink:      #1B2B1E;
    --ink2:     #4A6450;
    --ink3:     #8AA890;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  /* Header */
  header {
    background: var(--green);
    color: white;
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 12px rgba(45,106,79,0.3);
  }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  header p  { font-size: 13px; opacity: 0.8; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
  .year-select {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  .year-select option { background: var(--green); }
  .reload-btn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    padding: 6px 16px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .reload-btn:hover { background: rgba(255,255,255,0.25); }
  .cost-btn { background: #fff; color: var(--green); border: 0; padding: 7px 14px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }

  /* Layout */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 24px 48px;
  }

  /* Cards */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .stat-card .label { font-size: 12px; color: var(--ink3); margin-bottom: 8px; }
  .stat-card .value { font-size: 28px; font-weight: 700; color: var(--green); }
  .stat-card .sub   { font-size: 13px; color: var(--ink2); margin-top: 4px; }

  /* Grid */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .grid-1 { margin-bottom: 20px; }

  /* Section */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .section-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 14px;
    color: var(--ink);
    background: var(--bg);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-header span { font-size: 16px; }

  /* Table */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    padding: 10px 16px;
    text-align: left;
    font-size: 12px;
    color: var(--ink3);
    font-weight: 500;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  th.right, td.right { text-align: right; }
  td {
    padding: 11px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--ink);
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--green3); transition: background 0.15s; }

  .rank { color: var(--ink3); font-size: 12px; margin-right: 8px; min-width: 20px; display: inline-block; text-align: right; }
  .rank-1 { color: #B7791F; font-weight: 700; }
  .rank-2 { color: #718096; font-weight: 700; }
  .rank-3 { color: #9C4221; font-weight: 700; }

  .amount { font-weight: 600; color: var(--green2); }
  .month-bar {
    display: inline-block;
    height: 8px;
    background: var(--green3);
    border-radius: 4px;
    margin-left: 8px;
    vertical-align: middle;
    transition: width 0.4s ease;
  }
  .month-bar-fill {
    height: 100%;
    background: var(--green2);
    border-radius: 4px;
  }

  /* Loading / Empty */
  .loading {
    padding: 40px;
    text-align: center;
    color: var(--ink3);
    font-size: 14px;
  }
  .dot-anim::after {
    content: '';
    animation: dots 1.2s infinite;
  }
  @keyframes dots {
    0%   { content: ''; }
    33%  { content: '.'; }
    66%  { content: '..'; }
    100% { content: '...'; }
  }

  /* Badge */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    background: var(--green3);
    color: var(--green);
  }

  @media (max-width: 768px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .grid-2    { grid-template-columns: 1fr; }
    main { padding: 16px; }
    header { padding: 14px 16px; align-items:flex-start; gap:12px; }
    .header-right { gap:7px; }
    .cost-btn, .reload-btn, .year-select { font-size:12px; padding:6px 9px; }
  }

  /* 年度長條圖 */
  .chart-wrap {
    padding: 20px;
    overflow-x: auto;
  }
  .bar-chart {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    height: 180px;
    padding-bottom: 32px;
    position: relative;
    min-width: 300px;
  }
  .bar-chart::after {
    content: '';
    position: absolute;
    bottom: 32px;
    left: 0; right: 0;
    height: 1px;
    background: var(--border);
  }
  .bar-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex: 1;
    min-width: 48px;
  }
  .bar-val {
    font-size: 11px;
    color: var(--ink3);
    white-space: nowrap;
  }
  .bar-body {
    width: 100%;
    background: var(--green3);
    border-radius: 4px 4px 0 0;
    position: relative;
    transition: height 0.5s ease;
    cursor: default;
    min-height: 4px;
  }
  .bar-body.active { background: var(--green2); }
  .bar-body:hover { background: var(--green); }
  .bar-label {
    position: absolute;
    bottom: -28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--ink3);
    white-space: nowrap;
  }

  /* 客戶詳情 Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--surface);
    border-radius: 16px;
    width: 560px;
    max-width: 95vw;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .modal-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    position: sticky;
    top: 0;
    background: var(--surface);
  }
  .modal-title { font-size: 18px; font-weight: 700; color: var(--ink); }
  .modal-sub   { font-size: 13px; color: var(--ink3); margin-top: 4px; }
  .modal-close {
    background: none; border: none; font-size: 22px;
    color: var(--ink3); cursor: pointer; padding: 0 4px;
  }
  .modal-close:hover { color: var(--ink); }
  .modal-body { padding: 20px 24px; }
  .cost-form-row { margin-bottom: 16px; }
  .cost-form-row label { display:block; font-size:12px; color:var(--ink2); margin-bottom:6px; font-weight:600; }
  .cost-select { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:white; font:inherit; }
  .cost-source-status { padding:10px 12px; border-radius:8px; margin-bottom:14px; font-size:13px; background:#fff8dc; color:#7a5a00; }
  .cost-source-status.ready { background:var(--green3); color:var(--green); }
  .cost-material-title { font-size:13px; font-weight:700; margin:16px 0 8px; }
  .cost-material-row { display:grid; grid-template-columns:1fr 92px 72px; gap:8px; align-items:center; padding:7px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .cost-material-row input { width:100%; padding:7px; border:1px solid var(--border); border-radius:7px; text-align:right; font:inherit; }
  .cost-preview { margin-top:16px; padding:14px; border-radius:10px; background:var(--bg); display:flex; justify-content:space-between; align-items:center; }
  .cost-preview strong { color:var(--green); font-size:22px; }
  .cost-save { width:100%; margin-top:12px; padding:11px; border:0; border-radius:9px; background:var(--green); color:white; font:inherit; font-weight:700; cursor:pointer; }
  .cost-save:disabled { opacity:.55; cursor:wait; }
  .cost-choice-title { font-size:12px; color:var(--ink2); font-weight:700; margin:10px 0 7px; }
  .cost-choice-grid { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .cost-choice-btn { border:1px solid var(--border); background:white; color:var(--ink2); border-radius:20px; padding:7px 12px; font:inherit; font-size:13px; cursor:pointer; }
  .cost-choice-btn.active { background:var(--green); border-color:var(--green); color:white; font-weight:700; }
  .cost-pot-list { border:1px solid var(--border); border-radius:9px; max-height:230px; overflow:auto; }
  .cost-pot-option { display:flex; align-items:center; gap:9px; padding:9px 11px; border-bottom:1px solid var(--border); font-size:13px; cursor:pointer; }
  .cost-pot-option:last-child { border-bottom:0; }
  .cost-pot-option:hover { background:var(--green3); }
  .cost-pot-option input { width:18px; height:18px; accent-color:var(--green); flex:none; }

  .customer-link {
    cursor: pointer;
    color: var(--ink);
    text-decoration: none;
  }
  .customer-link:hover { color: var(--green); text-decoration: underline; }

  /* 客戶搜尋區塊 */
  .search-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .search-bar-wrap {
    padding: 16px 20px;
    display: flex;
    gap: 10px;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .search-input {
    flex: 1;
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--ink);
    background: var(--surface);
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--green2); }
  .search-btn {
    padding: 8px 18px;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .search-btn:hover { background: var(--green2); }
  .search-result-wrap {
    padding: 0;
    min-height: 48px;
  }
  .search-hint {
    padding: 20px;
    text-align: center;
    color: var(--ink3);
    font-size: 13px;
  }
  .search-customer-list { list-style: none; }
  .search-customer-item {
    padding: 11px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: background 0.15s;
  }
  .search-customer-item:last-child { border-bottom: none; }
  .search-customer-item:hover { background: var(--green3); }
  .search-cust-name { font-size: 14px; font-weight: 600; color: var(--ink); }
  .search-cust-meta { font-size: 12px; color: var(--ink3); margin-top: 2px; }
  .search-cust-amount { font-size: 14px; font-weight: 700; color: var(--green2); }

  /* 年度比較區塊 */
  .compare-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .compare-header {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    flex-wrap: wrap;
  }
  .compare-header span { font-weight: 600; font-size: 14px; color: var(--ink); white-space: nowrap; }
  .compare-year-select {
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--ink);
    background: var(--surface);
    outline: none;
  }
  .compare-btn {
    padding: 7px 18px;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
  }
  .compare-btn:hover { background: var(--green2); }
  .compare-body { padding: 20px; }
  .compare-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }
  .compare-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .compare-card-title {
    font-size: 12px;
    color: var(--ink3);
    margin-bottom: 6px;
  }
  .compare-val-wrap { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
  .compare-val-a { font-size: 22px; font-weight: 700; color: var(--green); }
  .compare-val-b { font-size: 22px; font-weight: 700; color: var(--ink2); }
  .compare-diff-up   { font-size: 13px; color: #2D6A4F; font-weight: 600; }
  .compare-diff-down { font-size: 13px; color: #c0392b; font-weight: 600; }
  .compare-diff-flat { font-size: 13px; color: var(--ink3); }
  .compare-sub-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    margin: 18px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .compare-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 20px; }
  .compare-table th {
    padding: 8px 12px;
    background: var(--green);
    color: white;
    font-weight: 600;
    text-align: left;
  }
  .compare-table th.right { text-align: right; }
  .compare-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .compare-table td.right { text-align: right; }
  .compare-table tr:last-child td { border-bottom: none; }
  .compare-table tr:hover td { background: var(--green3); }
  .compare-hint { padding: 30px; text-align: center; color: var(--ink3); font-size: 13px; }
  .year-tag-a { display: inline-block; background: var(--green); color: white; border-radius: 4px; padding: 1px 7px; font-size: 12px; margin-right: 4px; }
  .year-tag-b { display: inline-block; background: var(--ink2); color: white; border-radius: 4px; padding: 1px 7px; font-size: 12px; margin-right: 4px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>竹緣開運竹</h1>
    <p>營業報表系統</p>
  </div>
  <div class="header-right">
    <button class="cost-btn" onclick="openCostSetup()">🧮 成本設定</button>
    <select class="year-select" id="year-select" onchange="filterYear()">
      <option value="all">全部年份</option>
    </select>
    <button class="reload-btn" onclick="loadReport()">↻ 重新載入</button>
  </div>
</header>

<main>
  <!-- 年度比較 -->
  <div class="compare-section">
    <div class="compare-header">
      <span>📊 年度比較</span>
      <select class="compare-year-select" id="cmp-year-a"><option value="">選擇年份 A</option></select>
      <span style="color:var(--ink3);font-size:13px;">vs</span>
      <select class="compare-year-select" id="cmp-year-b"><option value="">選擇年份 B</option></select>
      <button class="compare-btn" onclick="runCompare()">比較</button>
    </div>
    <div id="compare-body">
      <div class="compare-hint">選擇兩個年份後按「比較」</div>
    </div>
  </div>

  <!-- 客戶搜尋 -->
  <div class="search-section">
    <div class="search-bar-wrap">
      <span style="font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap;">🔍 客戶查詢</span>
      <input class="search-input" id="cust-search-input" type="text" placeholder="輸入客戶姓名搜尋…" onkeydown="if(event.key==='Enter')searchCustomer()" />
      <button class="search-btn" onclick="searchCustomer()">搜尋</button>
    </div>
    <div class="search-result-wrap" id="cust-search-result">
      <div class="search-hint">輸入姓名後搜尋，可查看該客戶歷史訂單與購買偏好</div>
    </div>
  </div>

  <div id="report-area">
    <div class="loading dot-anim">載入中</div>
  </div>
</main>

<!-- 商品成本配方 Modal -->
<div class="modal-overlay" id="cost-modal" onclick="closeCostModal(event)">
  <div class="modal-box" style="width:680px;">
    <div class="modal-header"><div><div class="modal-title">商品成本設定</div><div class="modal-sub">選擇 CRM 商品，輸入每盆使用的竹子、配件與盆器數量</div></div><button class="modal-close" onclick="document.getElementById('cost-modal').classList.remove('open')">✕</button></div>
    <div class="modal-body">
      <div id="cost-source-status" class="cost-source-status">正在讀取庫存價格…</div>
      <div class="cost-form-row"><label>CRM 商品</label><div id="cost-category-choices"></div><div id="cost-product-choices"></div></div>
      <div id="cost-editor"></div>
    </div>
  </div>
</div>

<!-- 月份訂單 Modal -->
<div class="modal-overlay" id="month-modal" onclick="closeMonthModal(event)">
  <div class="modal-box" style="width:720px;">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-month-title"></div>
        <div class="modal-sub" id="modal-month-sub"></div>
      </div>
      <button class="modal-close" onclick="document.getElementById('month-modal').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body" id="modal-month-body">
      <div class="loading dot-anim">載入中</div>
    </div>
  </div>
</div>

<!-- 客戶詳情 Modal -->
<div class="modal-overlay" id="customer-modal" onclick="closeModal(event)">
  <div class="modal-box">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-cust-name"></div>
        <div class="modal-sub" id="modal-cust-sub"></div>
      </div>
      <button class="modal-close" onclick="document.getElementById('customer-modal').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body" id="modal-cust-body">
      <div class="loading dot-anim">載入中</div>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbybC0nhwz_ELXYt-bWgG7V-Y8TTgtwW1pMTdy96JhI3ORYSjVuNC2chd0aze9QXUIw/exec';
let costSetupData = null;
let costSelectedProductIndex = -1;
let costSelectedCategory = '';

function escapeHtml(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function closeCostModal(event) { if (!event || event.target === document.getElementById('cost-modal')) document.getElementById('cost-modal').classList.remove('open'); }
async function openCostSetup() {
  document.getElementById('cost-modal').classList.add('open');
  document.getElementById('cost-source-status').className = 'cost-source-status';
  document.getElementById('cost-source-status').textContent = '正在讀取庫存價格…';
  document.getElementById('cost-editor').innerHTML = '';
  try {
    const response = await fetch(API_URL + '?action=getCostSetupData&_=' + Date.now());
    costSetupData = await response.json();
    if (costSetupData.error) throw new Error(costSetupData.error);
    const status = document.getElementById('cost-source-status');
    status.className = 'cost-source-status' + (costSetupData.ready ? ' ready' : '');
    status.textContent = costSetupData.ready ? '庫存價格已連線；修改庫存單價後，這裡會自動採用新價格。' : (costSetupData.message || '庫存價格尚未連線');
    costSelectedProductIndex = -1;
    const categories = Array.from(new Set((costSetupData.products || []).map(function(p){ return p.category; })));
    costSelectedCategory = categories[0] || '';
    renderCostProductChoices();
  } catch (error) {
    document.getElementById('cost-source-status').textContent = '讀取失敗：' + error.message;
  }
}

function selectedCostProduct() {
  return costSetupData && costSelectedProductIndex >= 0 ? costSetupData.products[costSelectedProductIndex] : null;
}
function renderCostProductChoices() {
  const categories = Array.from(new Set((costSetupData.products || []).map(function(p){ return p.category; })));
  document.getElementById('cost-category-choices').innerHTML = '<div class="cost-choice-title">先選類別</div><div class="cost-choice-grid">' + categories.map(function(category){ return '<button type="button" class="cost-choice-btn' + (category===costSelectedCategory?' active':'') + '" onclick="selectCostCategory(&quot;' + encodeURIComponent(category) + '&quot;)">' + escapeHtml(category) + '</button>'; }).join('') + '</div>';
  const products = (costSetupData.products || []).map(function(p,index){ return {p:p,index:index}; }).filter(function(x){ return x.p.category===costSelectedCategory; });
  document.getElementById('cost-product-choices').innerHTML = '<div class="cost-choice-title">再選商品</div><div class="cost-choice-grid">' + products.map(function(x){ return '<button type="button" class="cost-choice-btn' + (x.index===costSelectedProductIndex?' active':'') + '" onclick="selectCostProduct(' + x.index + ')">' + escapeHtml(x.p.name) + '</button>'; }).join('') + '</div>';
}
function selectCostCategory(encoded) { costSelectedCategory=decodeURIComponent(encoded); costSelectedProductIndex=-1; document.getElementById('cost-editor').innerHTML=''; renderCostProductChoices(); }
function selectCostProduct(index) { costSelectedProductIndex=index; renderCostProductChoices(); loadSelectedRecipe(); }
function selectedRecipeFor(product) {
  return (costSetupData.recipes || []).find(function(r){ return r.category === product.category && r.name === product.name; }) || null;
}
function loadSelectedRecipe() {
  const product = selectedCostProduct(), editor = document.getElementById('cost-editor');
  if (!product) { editor.innerHTML = ''; return; }
  const saved = selectedRecipeFor(product), recipe = saved ? saved.recipe : {materials:[],pots:[]};
  const qtyMap = {}; (recipe.materials || []).forEach(function(m){ qtyMap[m.name] = Number(m.qty) || 0; });
  const groups = ['竹子','配件']; let html = '';
  groups.forEach(function(group){
    const list = (costSetupData.materials || []).filter(function(m){ return m.group === group; });
    if (!list.length) return;
    html += '<div class="cost-material-title">' + group + '用量（每盆）</div>';
    list.forEach(function(m){ const whole = group === '竹子'; html += '<div class="cost-material-row"><span>' + escapeHtml(m.name) + '</span><input class="material-qty" data-name="' + escapeHtml(m.name) + '" data-price="' + m.price + '" data-whole="' + (whole ? '1' : '0') + '" type="number" min="0" step="' + (whole ? '1' : '0.01') + '" inputmode="' + (whole ? 'numeric' : 'decimal') + '" value="' + (qtyMap[m.name] || '') + '" placeholder="0" oninput="normalizeMaterialQty(this);updateCostPreview()"><span>$' + Number(m.price).toLocaleString() + '/' + escapeHtml(m.unit || '單位') + '</span></div>'; });
  });
  const savedPots = Array.isArray(recipe.pots) ? recipe.pots : (recipe.pot ? [recipe.pot] : []), savedPotSkus = savedPots.map(function(p){return p.sku;});
  html += '<div class="cost-material-title">盆器（可複選，成本取平均）</div><div class="cost-form-row"><input id="cost-pot-search" class="cost-select" type="search" placeholder="輸入品名、顏色或 SKU 搜尋" oninput="filterCostPots()" style="margin-bottom:8px;"><div id="cost-pot-list" class="cost-pot-list">';
  (costSetupData.pots || []).forEach(function(p, i){ html += '<label class="cost-pot-option" data-search="' + escapeHtml((p.label+' '+p.sku).toLowerCase()) + '"><input class="cost-pot-check" type="checkbox" value="' + i + '"' + (savedPotSkus.indexOf(p.sku)>=0 ? ' checked' : '') + ' onchange="updateCostPreview()"><span>' + escapeHtml(p.label) + '｜$' + Number(p.price).toLocaleString() + '｜庫存 ' + p.stock + '</span></label>'; });
  html += '</div></div>';
  html += '<div class="cost-preview"><span>目前每盆成本</span><strong id="cost-preview-value">$0</strong></div><button id="cost-save" class="cost-save" onclick="saveCostRecipe()">儲存成本配方</button><div id="cost-save-msg" style="font-size:13px;text-align:center;margin-top:8px;color:var(--ink2);"></div>';
  editor.innerHTML = html; updateCostPreview();
}
function normalizeMaterialQty(input) {
  if (input.dataset.whole !== '1' || input.value === '') return;
  input.value = String(Math.max(0, Math.floor(Number(input.value) || 0)));
}
function filterCostPots() {
  const keyword = String(document.getElementById('cost-pot-search').value || '').trim().toLowerCase();
  Array.from(document.querySelectorAll('.cost-pot-option')).forEach(function(option) { option.style.display = !keyword || option.dataset.search.indexOf(keyword)>=0 ? 'flex' : 'none'; });
}
function collectCostRecipe() {
  const materials = Array.from(document.querySelectorAll('.material-qty')).map(function(input){ const qty=Number(input.value)||0; return {name:input.dataset.name, qty:input.dataset.whole==='1'?Math.floor(qty):qty}; }).filter(function(m){ return m.qty > 0; });
  const pots = Array.from(document.querySelectorAll('.cost-pot-check:checked')).map(function(input){ const p=costSetupData.pots[Number(input.value)]; return {sku:p.sku,name:p.label}; });
  return { materials:materials, pots:pots };
}
function updateCostPreview() {
  if (!costSetupData || !document.getElementById('cost-preview-value')) return;
  const recipe = collectCostRecipe(); let total = 0;
  recipe.materials.forEach(function(m){ const src = costSetupData.materials.find(function(x){return x.name===m.name;}); if(src) total += src.price*m.qty; });
  if (recipe.pots.length) { let potTotal=0; recipe.pots.forEach(function(selected){ const pot=costSetupData.pots.find(function(x){return x.sku===selected.sku;}); if(pot) potTotal+=pot.price; }); total += potTotal/recipe.pots.length; }
  document.getElementById('cost-preview-value').textContent = '$' + Math.round(total * 100) / 100;
}
async function saveCostRecipe() {
  const product = selectedCostProduct(), button = document.getElementById('cost-save'), msg = document.getElementById('cost-save-msg');
  if (!product) return;
  const recipe = collectCostRecipe();
  button.disabled = true; button.textContent = '儲存中…'; msg.textContent = '';
  try {
    const url = API_URL + '?action=saveProductRecipeGet&category=' + encodeURIComponent(product.category) + '&name=' + encodeURIComponent(product.name) + '&recipe=' + encodeURIComponent(JSON.stringify(recipe)) + '&_=' + Date.now();
    const response = await fetch(url), result = await response.json(); if (result.error) throw new Error(result.error);
    msg.textContent = '已儲存，每盆成本 $' + Number(result.unitCost).toLocaleString();
    const old = selectedRecipeFor(product), next = {category:product.category,name:product.name,recipe:recipe,unitCost:result.unitCost,complete:true,updatedAt:result.updatedAt};
    if (old) Object.assign(old,next); else costSetupData.recipes.push(next);
  } catch (error) { msg.textContent = '儲存失敗：' + error.message; }
  finally { button.disabled = false; button.textContent = '儲存成本配方'; }
}

// ── 年度比較 ──
function runCompare() {
  const yearA = document.getElementById('cmp-year-a').value;
  const yearB = document.getElementById('cmp-year-b').value;
  const body  = document.getElementById('compare-body');

  if (!yearA || !yearB) {
    body.innerHTML = '<div class="compare-hint">請選擇兩個年份</div>';
    return;
  }
  if (yearA === yearB) {
    body.innerHTML = '<div class="compare-hint">請選擇不同的年份</div>';
    return;
  }
  if (!reportData) {
    body.innerHTML = '<div class="compare-hint">資料尚未載入，請稍後再試</div>';
    return;
  }

  const mA = reportData.monthly.filter(function(m){ return m.month.startsWith(yearA); });
  const mB = reportData.monthly.filter(function(m){ return m.month.startsWith(yearB); });

  const totalA  = mA.reduce(function(s,m){ return s + m.amount; }, 0);
  const totalB  = mB.reduce(function(s,m){ return s + m.amount; }, 0);
  const orderA  = mA.reduce(function(s,m){ return s + m.count; }, 0);
  const orderB  = mB.reduce(function(s,m){ return s + m.count; }, 0);
  const avgA    = orderA > 0 ? Math.round(totalA / orderA) : 0;
  const avgB    = orderB > 0 ? Math.round(totalB / orderB) : 0;

  function diffHtml(a, b, prefix) {
    if (b === 0) return '';
    const pct = Math.round((a - b) / b * 100);
    if (pct > 0)  return '<span class="compare-diff-up">▲ ' + (prefix||'') + pct + '%</span>';
    if (pct < 0)  return '<span class="compare-diff-down">▼ ' + (prefix||'') + Math.abs(pct) + '%</span>';
    return '<span class="compare-diff-flat">持平</span>';
  }

  // 月份對比表（Jan~Dec）
  var monthRows = '';
  for (var mo = 1; mo <= 12; mo++) {
    var label = String(mo).padStart(2,'0');
    var mDataA = mA.find(function(m){ return m.month.slice(5,7) === label; });
    var mDataB = mB.find(function(m){ return m.month.slice(5,7) === label; });
    if (!mDataA && !mDataB) continue;
    var amtA = mDataA ? mDataA.amount : 0;
    var amtB = mDataB ? mDataB.amount : 0;
    var diff = amtA - amtB;
    var diffStr = diff > 0
      ? '<span class="compare-diff-up">▲ $' + Math.abs(diff).toLocaleString() + '</span>'
      : diff < 0
      ? '<span class="compare-diff-down">▼ $' + Math.abs(diff).toLocaleString() + '</span>'
      : '<span class="compare-diff-flat">—</span>';
    monthRows += '<tr>'
      + '<td>' + mo + ' 月</td>'
      + '<td class="right">$' + amtA.toLocaleString() + '</td>'
      + '<td class="right">$' + amtB.toLocaleString() + '</td>'
      + '<td class="right">' + diffStr + '</td>'
      + '</tr>';
  }

  // 客戶排名對比（依消費額）
  function buildCustMap(orders, year) {
    var map = {};
    if (!Array.isArray(orders)) return map;
    orders.forEach(function(o) {
      if (!(o.date||'').startsWith(year)) return;
      if (!o.customerName) return;
      if (!map[o.customerName]) map[o.customerName] = { amount: 0, count: 0 };
      map[o.customerName].amount += (o.totalAmount || 0);
      map[o.customerName].count++;
    });
    return map;
  }

  var custMapA = buildCustMap(allOrdersCache, yearA);
  var custMapB = buildCustMap(allOrdersCache, yearB);
  var allCusts = Array.from(new Set(Object.keys(custMapA).concat(Object.keys(custMapB))));
  allCusts.sort(function(a,b){
    var aA = (custMapA[a]||{}).amount||0;
    var bA = (custMapA[b]||{}).amount||0;
    return bA - aA;
  });
  var custRows = '';
  allCusts.slice(0,10).forEach(function(name, i) {
    var dA = custMapA[name] || { amount:0, count:0 };
    var dB = custMapB[name] || { amount:0, count:0 };
    var diff = dA.amount - dB.amount;
    var diffStr = diff > 0
      ? '<span class="compare-diff-up">▲ $' + Math.abs(diff).toLocaleString() + '</span>'
      : diff < 0
      ? '<span class="compare-diff-down">▼ $' + Math.abs(diff).toLocaleString() + '</span>'
      : '<span class="compare-diff-flat">—</span>';
    custRows += '<tr>'
      + '<td>' + (i+1) + '. ' + name + '</td>'
      + '<td class="right">$' + dA.amount.toLocaleString() + ' (' + dA.count + '筆)</td>'
      + '<td class="right">$' + dB.amount.toLocaleString() + ' (' + dB.count + '筆)</td>'
      + '<td class="right">' + diffStr + '</td>'
      + '</tr>';
  });

  // 熱銷排名對比
  function buildProductMap(orders, year) {
    var map = {};
    if (!Array.isArray(orders)) return map;
    orders.forEach(function(o) {
      if (!(o.date||'').startsWith(year)) return;
      (o.items || []).forEach(function(item) {
        var key = item.name || '';
        if (!key) return;
        if (!map[key]) map[key] = { qty: 0, amount: 0 };
        map[key].qty    += (item.qty || 0);
        var price = Math.max(0, Number(item.price) || 0);
        var discount = Math.max(0, Math.min(price, Number(item.discountPerUnit) || 0));
        var askingPrice = item.pricingMode === 'bargain' ? Math.max(0, Number(item.askingPrice) >= 0 ? Number(item.askingPrice) : price) : price;
        var dealPrice = item.pricingMode === 'bargain' ? Math.max(0, Number(item.dealPrice) >= 0 ? Number(item.dealPrice) : askingPrice) : price - discount;
        map[key].amount += dealPrice * (item.qty || 0);
      });
    });
    return map;
  }

  var prodMapA = buildProductMap(allOrdersCache, yearA);
  var prodMapB = buildProductMap(allOrdersCache, yearB);
  var allProds = Array.from(new Set(Object.keys(prodMapA).concat(Object.keys(prodMapB))));
  allProds.sort(function(a,b){
    var aQ = (prodMapA[a]||{}).qty||0;
    var bQ = (prodMapA[b]||{}).qty||0;
    return bQ - aQ;
  });
  var prodRows = '';
  allProds.slice(0,10).forEach(function(name, i) {
    var dA = prodMapA[name] || { qty:0, amount:0 };
    var dB = prodMapB[name] || { qty:0, amount:0 };
    var diff = dA.qty - dB.qty;
    var diffStr = diff > 0
      ? '<span class="compare-diff-up">▲ ' + Math.abs(diff) + ' 盆</span>'
      : diff < 0
      ? '<span class="compare-diff-down">▼ ' + Math.abs(diff) + ' 盆</span>'
      : '<span class="compare-diff-flat">—</span>';
    prodRows += '<tr>'
      + '<td>' + (i+1) + '. ' + name + '</td>'
      + '<td class="right">' + dA.qty + ' 盆</td>'
      + '<td class="right">' + dB.qty + ' 盆</td>'
      + '<td class="right">' + diffStr + '</td>'
      + '</tr>';
  });

  var tagA = '<span class="year-tag-a">' + yearA + '</span>';
  var tagB = '<span class="year-tag-b">' + yearB + '</span>';

  var html = '<div class="compare-body">';

  // 總覽卡片
  html += '<div class="compare-grid">';
  html += '<div class="compare-card"><div class="compare-card-title">年度總營業額</div>'
    + '<div class="compare-val-wrap">'
    + tagA + '<span class="compare-val-a">$' + totalA.toLocaleString() + '</span>'
    + tagB + '<span class="compare-val-b">$' + totalB.toLocaleString() + '</span>'
    + diffHtml(totalA, totalB) + '</div></div>';
  html += '<div class="compare-card"><div class="compare-card-title">年度總訂單數</div>'
    + '<div class="compare-val-wrap">'
    + tagA + '<span class="compare-val-a">' + orderA + ' 筆</span>'
    + tagB + '<span class="compare-val-b">' + orderB + ' 筆</span>'
    + diffHtml(orderA, orderB) + '</div></div>';
  html += '<div class="compare-card"><div class="compare-card-title">平均客單價</div>'
    + '<div class="compare-val-wrap">'
    + tagA + '<span class="compare-val-a">$' + avgA.toLocaleString() + '</span>'
    + tagB + '<span class="compare-val-b">$' + avgB.toLocaleString() + '</span>'
    + diffHtml(avgA, avgB) + '</div></div>';
  html += '</div>';

  // 月份對比
  html += '<div class="compare-sub-title">月營收比較</div>';
  if (monthRows) {
    html += '<table class="compare-table"><thead><tr>'
      + '<th>月份</th><th class="right">' + tagA + yearA + '</th><th class="right">' + tagB + yearB + '</th><th class="right">差異</th>'
      + '</tr></thead><tbody>' + monthRows + '</tbody></table>';
  } else {
    html += '<div class="compare-hint">無月份資料</div>';
  }

  // 客戶排名對比
  html += '<div class="compare-sub-title">客戶消費排名比較（Top 10）</div>';
  if (custRows) {
    html += '<table class="compare-table"><thead><tr>'
      + '<th>客戶</th><th class="right">' + tagA + yearA + '</th><th class="right">' + tagB + yearB + '</th><th class="right">差異</th>'
      + '</tr></thead><tbody>' + custRows + '</tbody></table>';
  } else {
    html += '<div class="compare-hint">無客戶資料</div>';
  }

  // 熱銷排名對比
  html += '<div class="compare-sub-title">熱銷商品排名比較（Top 10）</div>';
  if (prodRows) {
    html += '<table class="compare-table"><thead><tr>'
      + '<th>商品</th><th class="right">' + tagA + yearA + '</th><th class="right">' + tagB + yearB + '</th><th class="right">差異</th>'
      + '</tr></thead><tbody>' + prodRows + '</tbody></table>';
  } else {
    html += '<div class="compare-hint">無商品資料</div>';
  }

  html += '</div>';
  body.innerHTML = html;
}


let reportData = null;

async function loadReport() {
  const area = document.getElementById('report-area');
  area.innerHTML = '<div class="loading dot-anim">載入中</div>';
  try {
    const r = await fetch(API_URL + '?action=getReport');
    reportData = await r.json();
    if (reportData.error) throw new Error(reportData.error);

    const years = [...new Set(reportData.monthly.map(m => m.month.slice(0,4)))].sort().reverse();
    const sel = document.getElementById('year-select');
    sel.innerHTML = '<option value="all">全部年份</option>';
    years.forEach(y => {
      const opt = document.createElement('option');
      opt.value = y; opt.textContent = y + ' 年';
      sel.appendChild(opt);
    });
    // 填入年度比較選單
    const cmpA = document.getElementById('cmp-year-a');
    const cmpB = document.getElementById('cmp-year-b');
    cmpA.innerHTML = '<option value="">選擇年份 A</option>';
    cmpB.innerHTML = '<option value="">選擇年份 B</option>';
    years.forEach(function(y) {
      cmpA.innerHTML += '<option value="' + y + '">' + y + ' 年</option>';
      cmpB.innerHTML += '<option value="' + y + '">' + y + ' 年</option>';
    });
    // 預設選最近兩年
    if (years.length >= 1) cmpA.value = years[0];
    if (years.length >= 2) cmpB.value = years[1];
    // 預先撈所有訂單，補充上次叫貨日期
    let allOrders = [];
    try {
      const ro = await fetch(API_URL + '?action=getAllOrders');
      const od = await ro.json();
      if (Array.isArray(od)) { allOrders = od; allOrdersCache = od; }
    } catch(e) {}
    reportData._allCustomersRaw = reportData.customers;
    reportData.customers = buildAllCustomersWithDate(reportData.customers, allOrders);
    renderReport('all');
  } catch(e) {
    area.innerHTML = '<div class="loading">載入失敗：' + e.message + '</div>';
  }
}

function filterYear() {
  const year = document.getElementById('year-select').value;
  window._custPage = 1;
  renderReport(year);
}

function buildPeriodMetrics(orders, year) {
  const filtered = (Array.isArray(orders) ? orders : []).filter(function(order) {
    return year === 'all' || (order.date || '').startsWith(year);
  });
  const products = {}, customers = {};
  let knownRevenue = 0, totalCost = 0, missingItems = 0;
  filtered.forEach(function(order) {
    const customerName = order.customerName || '未命名客戶';
    if (!customers[customerName]) customers[customerName] = { name: customerName, amount: 0, count: 0, lastDate: '—' };
    customers[customerName].amount += Number(order.totalAmount) || 0;
    customers[customerName].count++;
    const date = (order.date || '').slice(0, 10);
    if (date && (customers[customerName].lastDate === '—' || date > customers[customerName].lastDate)) customers[customerName].lastDate = date;
    let orderItems = Array.isArray(order.items) ? order.items : [];
    if (!orderItems.length && order.detail) {
      orderItems = String(order.detail).split('、').map(function(part) {
        const match = part.match(/^(.+?) x(\d+)\(\$(\d+(?:\.\d+)?)\)$/);
        if (!match) return null;
        const qty = Number(match[2]) || 0;
        return { name: match[1], qty: qty, price: qty > 0 ? (Number(match[3]) || 0) / qty : 0, netPrice: qty > 0 ? (Number(match[3]) || 0) / qty : 0, costComplete: false };
      }).filter(Boolean);
    }
    orderItems.forEach(function(item) {
      const name = item.name || '未命名商品';
      const qty = Math.max(0, Number(item.qty) || 0);
      const revenue = Math.max(0, Number(item.netPrice) >= 0 ? Number(item.netPrice) : Number(item.price) || 0) * qty;
      if (!products[name]) products[name] = { name: name, qty: 0, amount: 0, knownRevenue: 0, cost: 0, missingItems: 0 };
      products[name].qty += qty;
      products[name].amount += revenue;
      if (item.costComplete === true && item.unitCost !== null && isFinite(Number(item.unitCost))) {
        const cost = Math.max(0, Number(item.unitCost)) * qty;
        products[name].knownRevenue += revenue;
        products[name].cost += cost;
        knownRevenue += revenue;
        totalCost += cost;
      } else {
        products[name].missingItems++;
        missingItems++;
      }
    });
  });
  return {
    products: Object.values(products).sort(function(a,b) { return b.qty - a.qty; }).slice(0, 10),
    customers: Object.values(customers).sort(function(a,b) { return b.amount - a.amount; }),
    knownRevenue: knownRevenue, totalCost: totalCost,
    grossProfit: knownRevenue - totalCost,
    marginRate: knownRevenue > 0 ? (knownRevenue - totalCost) / knownRevenue * 100 : 0,
    missingItems: missingItems
  };
}

function renderReport(year) {
  if (!reportData) return;
  const area = document.getElementById('report-area');

  const monthly = year === 'all' ? reportData.monthly : reportData.monthly.filter(m => m.month.startsWith(year));
  const totalAmount = monthly.reduce((s, m) => s + m.amount, 0);
  const totalOrders = monthly.reduce((s, m) => s + m.count, 0);
  const avgOrder    = totalOrders > 0 ? Math.round(totalAmount / totalOrders) : 0;
  const maxMonth    = monthly.length > 0 ? Math.max(...monthly.map(m => m.amount)) : 1;
  const period = buildPeriodMetrics(allOrdersCache || [], year);
  const products = allOrdersCache ? period.products : reportData.products;
  const customers = allOrdersCache ? period.customers : reportData.customers;
  const knownRevenue = allOrdersCache ? period.knownRevenue : monthly.reduce((s, m) => s + (m.knownRevenue || 0), 0);
  const totalCost = allOrdersCache ? period.totalCost : monthly.reduce((s, m) => s + (m.cost || 0), 0);
  const grossProfit = knownRevenue - totalCost;
  const marginRate = knownRevenue > 0 ? grossProfit / knownRevenue * 100 : 0;
  const missingItems = allOrdersCache ? period.missingItems : monthly.reduce((s, m) => s + (m.missingItems || 0), 0);

  let html = '';

  // 統計卡片
  html += '<div class="stats-row">';
  html += statCard('總營業額', '$' + totalAmount.toLocaleString(), year === 'all' ? '全部期間' : year + ' 年');
  html += statCard('總訂單數', totalOrders + ' 筆', year === 'all' ? '全部期間' : year + ' 年');
  html += statCard('平均客單價', '$' + avgOrder.toLocaleString(), '每筆訂單平均');
  html += statCard('活躍月份', monthly.filter(m => m.count > 0).length + ' 個月', '有訂單的月份');
  html += statCard('商品成本', '$' + Math.round(totalCost).toLocaleString(), knownRevenue > 0 ? '已設定成本的品項' : '尚無完整成本資料');
  html += statCard('毛利', '$' + Math.round(grossProfit).toLocaleString(), '實收減商品成本');
  html += statCard('毛利率', marginRate.toFixed(1) + '%', knownRevenue > 0 ? '依已設定成本品項計算' : '尚無完整成本資料');
  html += '</div>';

  if (missingItems > 0) {
    html += '<div style="margin:-8px 0 20px;padding:12px 16px;border:1px solid #e6c86e;background:#fff8df;border-radius:10px;color:#705a16;font-size:13px;">'
      + '尚有 ' + missingItems + ' 筆品項缺少成本快照，以上成本與毛利只計算資料完整的品項；舊訂單不會套用目前成本。'
      + '</div>';
  }

  const costMappings = Array.isArray(reportData.costMappings) ? reportData.costMappings : [];
  const missingMappings = costMappings.filter(function(item) { return !item.matched && item.category !== '客製'; });
  if (missingMappings.length > 0) {
    html += '<div style="margin:-8px 0 20px;padding:12px 16px;border:1px solid #e6c86e;background:#fff8df;border-radius:10px;color:#705a16;font-size:13px;">'
      + '<b>尚未建立成本配方：</b>' + missingMappings.map(function(item) { return item.name; }).join('、')
      + '<br><span style="font-size:12px;">請按右上角「成本設定」，選擇商品並填入每盆用量。</span></div>';
  }

  // 年度長條圖（全部年份時顯示）
  if (year === 'all' && reportData.yearly.length > 0) {
    const maxY = Math.max(...reportData.yearly.map(y => y.amount));
    html += '<div class="section" style="margin-bottom:20px;">';
    html += '<div class="section-header"><span>📊</span>年度營業額比較</div>';
    html += '<div class="chart-wrap"><div class="bar-chart">';
    reportData.yearly.slice().reverse().forEach(function(y) {
      const pct = maxY > 0 ? Math.round((y.amount / maxY) * 140) : 4;
      html += '<div class="bar-col">';
      html += '<div class="bar-val">$' + (y.amount / 10000).toFixed(0) + '萬</div>';
      html += '<div class="bar-body" style="height:' + pct + 'px;" title="' + y.year + '年 $' + y.amount.toLocaleString() + '">';
      html += '<span class="bar-label">' + y.year + '</span>';
      html += '</div></div>';
    });
    html += '</div></div></div>';
  }

  // 月營業額 + 年度統計
  html += '<div class="grid-2" style="margin-bottom:20px;">';

  // 月營業額
  html += '<div class="section">';
  html += '<div class="section-header"><span>📅</span>每月營業額</div>';
  html += '<table><thead><tr><th>月份</th><th class="right">營業額</th><th class="right">訂單數</th><th>趨勢</th></tr></thead><tbody>';
  monthly.forEach(function(m) {
    const barPct = maxMonth > 0 ? Math.round((m.amount / maxMonth) * 100) : 0;
    html += '<tr style="cursor:pointer;" onclick="showMonthDetail(\'' + m.month + '\')" title="點擊查看該月訂單">';
    html += '<td style="color:var(--green2);text-decoration:underline;text-underline-offset:3px;">' + m.month + '</td>';
    html += '<td class="right amount">$' + m.amount.toLocaleString() + '</td>';
    html += '<td class="right">' + m.count + ' 筆</td>';
    html += '<td><div class="month-bar" style="width:80px;"><div class="month-bar-fill" style="width:' + barPct + '%;"></div></div></td></tr>';
  });
  if (!monthly.length) html += '<tr><td colspan="4" style="text-align:center;color:var(--ink3);padding:24px;">無資料</td></tr>';
  html += '</tbody></table></div>';

  // 年度統計
  html += '<div class="section">';
  html += '<div class="section-header"><span>📆</span>年度統計</div>';
  html += '<table><thead><tr><th>年份</th><th class="right">營業額</th><th class="right">訂單數</th></tr></thead><tbody>';
  reportData.yearly.forEach(function(y) {
    html += '<tr><td><span class="badge">' + y.year + '</span></td>';
    html += '<td class="right amount">$' + y.amount.toLocaleString() + '</td>';
    html += '<td class="right">' + y.count + ' 筆</td></tr>';
  });
  html += '</tbody></table></div>';
  html += '</div>';

  // 熱銷商品（獨立區塊）
  html += '<div class="section" style="margin-bottom:20px;">';
  html += '<div class="section-header"><span>🏆</span>熱銷商品 Top 10</div>';
  html += '<table><thead><tr><th>商品</th><th class="right">數量</th><th class="right">實收</th><th class="right">成本</th><th class="right">毛利</th><th class="right">毛利率</th></tr></thead><tbody>';
  products.forEach(function(p, i) {
    const rc = i < 3 ? 'rank-'+(i+1) : '';
    const profit = (p.knownRevenue || 0) - (p.cost || 0);
    const rate = (p.knownRevenue || 0) > 0 ? profit / p.knownRevenue * 100 : 0;
    const incomplete = (p.missingItems || 0) > 0;
    html += '<tr><td><span class="rank ' + rc + '">' + (i+1) + '</span>' + p.name + '</td>';
    html += '<td class="right">' + p.qty + ' 盆</td>';
    html += '<td class="right amount">$' + p.amount.toLocaleString() + '</td>';
    html += '<td class="right">' + ((p.knownRevenue || 0) > 0 || (p.cost || 0) > 0 ? '$' + Math.round(p.cost || 0).toLocaleString() : '—') + '</td>';
    html += '<td class="right">' + ((p.knownRevenue || 0) > 0 ? '$' + Math.round(profit).toLocaleString() : '—') + '</td>';
    html += '<td class="right">' + ((p.knownRevenue || 0) > 0 ? rate.toFixed(1) + '%' : '—') + (incomplete ? '<br><span style="font-size:10px;color:#b7791f;">部分缺成本</span>' : '') + '</td></tr>';
  });
  html += '</tbody></table></div>';

  // 客戶消費總覽（全部，分頁）
  html += '<div class="section" id="cust-table-section">';
  html += '<div class="section-header"><span>👑</span>客戶消費總覽 <span id="cust-page-label" style="font-size:11px;font-weight:400;color:var(--ink3);margin-left:8px;"></span></div>';
  html += '<table><thead><tr><th>排名</th><th>客戶</th><th class="right">消費額</th><th class="right">訂單數</th><th class="right">上次叫貨</th></tr></thead><tbody id="cust-table-body"></tbody></table>';
  html += '<div id="cust-pagination" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 16px;border-top:1px solid var(--border);"></div>';
  html += '</div>';

  area.innerHTML = html;

  // 初始化客戶分頁
  window._allCustomers = customers;
  window._custPage = 1;
  renderCustTable();
}

// 從訂單資料補充「上次叫貨日期」給所有客戶
function buildAllCustomersWithDate(customers, orders) {
  const lastDate = {};
  if (Array.isArray(orders)) {
    orders.forEach(function(o) {
      const n = o.customerName;
      const d = (o.date || '').slice(0,10);
      if (n && (!lastDate[n] || d > lastDate[n])) lastDate[n] = d;
    });
  }
  return customers.map(function(c) {
    return { name: c.name, amount: c.amount, count: c.count, lastDate: lastDate[c.name] || '—' };
  });
}

function renderCustTable() {
  const list = window._allCustomers || [];
  const PAGE = 10;
  const page = window._custPage || 1;
  const total = list.length;
  const totalPages = Math.ceil(total / PAGE);
  const start = (page - 1) * PAGE;
  const slice = list.slice(start, start + PAGE);

  const label = document.getElementById('cust-page-label');
  if (label) label.textContent = '第 ' + page + ' 頁 / 共 ' + total + ' 位客戶　點名字查看詳情';

  const tbody = document.getElementById('cust-table-body');
  if (tbody) {
    tbody.innerHTML = '';
    slice.forEach(function(c, i) {
      const rank = start + i + 1;
      const rc = rank <= 3 ? 'rank-' + rank : '';
      const tr = document.createElement('tr');
      const encodedName = encodeURIComponent(c.name);
      tr.innerHTML = [
        '<td><span class="rank ' + rc + '">' + rank + '</span></td>',
        '<td><a class="customer-link" onclick="showCustomerDetail(&quot;' + encodedName + '&quot;,' + c.amount + ',' + c.count + ')">' + c.name + '</a></td>',
        '<td class="right amount">$' + c.amount.toLocaleString() + '</td>',
        '<td class="right">' + c.count + ' 筆</td>',
        '<td class="right" style="color:var(--ink2);font-size:13px;">' + (c.lastDate || '—') + '</td>'
      ].join('');
      tbody.appendChild(tr);
    });
  }

  const pg = document.getElementById('cust-pagination');
  if (pg) {
    let btns = '';
    btns += '<button onclick="setCustPage(' + Math.max(1, page-1) + ')" ' + (page === 1 ? 'disabled' : '') + ' style="' + pgBtnStyle(page === 1) + '">‹ 上一頁</button>';
    const maxBtn = 5;
    let startP = Math.max(1, page - 2);
    let endP = Math.min(totalPages, startP + maxBtn - 1);
    if (endP - startP < maxBtn - 1) startP = Math.max(1, endP - maxBtn + 1);
    for (let p = startP; p <= endP; p++) {
      btns += '<button onclick="setCustPage(' + p + ')" style="' + pgBtnStyle(false, p === page) + '">' + p + '</button>';
    }
    btns += '<button onclick="setCustPage(' + Math.min(totalPages, page+1) + ')" ' + (page === totalPages ? 'disabled' : '') + ' style="' + pgBtnStyle(page === totalPages) + '">下一頁 ›</button>';
    btns += '<span style="font-size:12px;color:var(--ink3);">' + page + ' / ' + totalPages + ' 頁</span>';
    pg.innerHTML = btns;
  }
}

function pgBtnStyle(disabled, active) {
  const base = "padding:5px 12px;border-radius:6px;font-size:13px;font-family:'Noto Sans TC',sans-serif;cursor:pointer;border:1px solid var(--border);transition:background 0.15s;";
  if (disabled) return base + 'background:var(--bg);color:var(--ink3);cursor:default;';
  if (active)   return base + 'background:var(--green);color:white;border-color:var(--green);';
  return base + 'background:var(--surface);color:var(--ink);';
}

function setCustPage(p) {
  window._custPage = p;
  renderCustTable();
  document.getElementById('cust-table-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function statCard(label, value, sub) {
  return '<div class="stat-card"><div class="label">' + label + '</div><div class="value">' + value + '</div><div class="sub">' + sub + '</div></div>';
}

function orderDetailHtml(order) {
  if (!Array.isArray(order.items) || !order.items.length) return order.detail || '';
  return order.items.map(function(item) {
    var price = Number(item.price) || 0;
    var qty = Number(item.qty) || 0;
    var discount = Math.max(0, Number(item.discountPerUnit) || 0);
    var isBargain = item.pricingMode === 'bargain' && item.category !== '客製';
    var askingPrice = isBargain ? Math.max(0, Number(item.askingPrice) >= 0 ? Number(item.askingPrice) : price) : price;
    var original = askingPrice * qty;
    var dealPrice = isBargain ? Math.max(0, Number(item.dealPrice) >= 0 ? Number(item.dealPrice) : askingPrice) : price - discount;
    var net = dealPrice * qty;
    var hasCost = item.costComplete === true && item.unitCost !== null && isFinite(Number(item.unitCost));
    var cost = hasCost ? Math.max(0, Number(item.unitCost)) * qty : 0;
    var text = item.name + ' x' + qty + ' ($' + original.toLocaleString() + ')';
    if (isBargain) text += '<br><span style="color:var(--red);">↳ 折扣 -$' + (Math.max(0, askingPrice - dealPrice) * qty).toLocaleString() + '，本項實收 $' + net.toLocaleString() + '</span>';
    else if (discount > 0) text += '<br><span style="color:var(--red);">↳ 自取優惠 每盆-$' + discount.toLocaleString() + '，本項實收 $' + net.toLocaleString() + '</span>';
    if (hasCost) text += '<br><span style="color:var(--green2);">↳ 成本 $' + cost.toLocaleString() + '，毛利 $' + (net - cost).toLocaleString() + '</span>';
    else text += '<br><span style="color:var(--ink3);">↳ 成本未設定</span>';
    return text;
  }).join('<br>');
}

// ── 月份訂單明細 ──
async function showMonthDetail(month) {
  document.getElementById('modal-month-title').textContent = month + ' 訂單明細';
  document.getElementById('modal-month-sub').textContent = '載入中...';
  document.getElementById('modal-month-body').innerHTML = '<div class="loading dot-anim">載入中</div>';
  document.getElementById('month-modal').classList.add('open');

  try {
    const r = await fetch(API_URL + '?action=getAllOrders');
    const orders = await r.json();
    if (!Array.isArray(orders)) throw new Error('資料錯誤');

    const monthOrders = orders.filter(o => o.date && o.date.startsWith(month));

    const totalAmt = monthOrders.reduce((s, o) => s + (o.totalAmount || 0), 0);
    const totalQty = monthOrders.reduce((s, o) => s + (o.totalQty || 0), 0);

    document.getElementById('modal-month-sub').textContent =
      monthOrders.length + ' 筆訂單・' + totalQty + ' 盆・$' + totalAmt.toLocaleString();

    if (!monthOrders.length) {
      document.getElementById('modal-month-body').innerHTML = '<div class="loading">本月無訂單</div>';
      return;
    }

    // 統計本月客戶
    const custMap = {};
    monthOrders.forEach(function(o) {
      const n = o.customerName;
      if (!custMap[n]) custMap[n] = { count: 0, amount: 0 };
      custMap[n].count++;
      custMap[n].amount += o.totalAmount || 0;
    });

    let html = '';

    // 本月客戶摘要
    html += '<div style="margin-bottom:20px;">';
    html += '<div style="font-size:12px;color:var(--ink3);margin-bottom:10px;font-weight:500;">本月客戶（' + Object.keys(custMap).length + ' 位）</div>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:8px;">';
    Object.keys(custMap).sort().forEach(function(name) {
      const c = custMap[name];
      html += '<div style="background:var(--green3);border-radius:8px;padding:6px 12px;font-size:13px;">';
      html += '<span style="font-weight:600;color:var(--green);">' + name + '</span>';
      html += '<span style="color:var(--ink3);margin-left:6px;">' + c.count + '筆 $' + c.amount.toLocaleString() + '</span>';
      html += '</div>';
    });
    html += '</div></div>';

    // 訂單列表
    html += '<div style="font-size:12px;color:var(--ink3);margin-bottom:10px;font-weight:500;">訂單列表</div>';
    html += '<table><thead><tr><th>日期</th><th>客戶</th><th>明細</th><th class="right">盆數</th><th class="right">金額</th></tr></thead><tbody>';
    monthOrders.forEach(function(o) {
      html += '<tr>';
      html += '<td style="white-space:nowrap;font-size:12px;">' + o.date.slice(0,10) + '</td>';
      html += '<td style="white-space:nowrap;font-weight:500;">' + o.customerName + '</td>';
      html += '<td style="font-size:12px;color:var(--ink2);">' + orderDetailHtml(o) + '</td>';
      html += '<td class="right">' + o.totalQty + '</td>';
      html += '<td class="right amount">$' + (o.totalAmount||0).toLocaleString() + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table>';

    document.getElementById('modal-month-body').innerHTML = html;
  } catch(e) {
    document.getElementById('modal-month-body').innerHTML = '<div class="loading">載入失敗：' + e.message + '</div>';
  }

// ── 客戶詳情 ──
async function showCustomerDetail(encodedName, totalAmount, orderCount) {
  const name = decodeURIComponent(encodedName);
  document.getElementById('modal-cust-name').textContent = name;
  document.getElementById('modal-cust-sub').textContent = '累積消費 $' + totalAmount.toLocaleString() + '　訂單 ' + orderCount + ' 筆';
  document.getElementById('modal-cust-body').innerHTML = '<div class="loading dot-anim">載入中</div>';
  document.getElementById('customer-modal').classList.add('open');

  try {
    // 從所有訂單裡篩這個客戶（用名字比對，因為排行榜只有名字）
    const r = await fetch(API_URL + '?action=getAllOrders');
    const orders = await r.json();
    if (!Array.isArray(orders)) throw new Error('資料錯誤');

    const custOrders = orders.filter(o => o.customerName === name);

    // 統計商品購買量
    const productMap = {};
    custOrders.forEach(function(o) {
      o.detail.split('、').forEach(function(part) {
        const m = part.match(/^(.+?) x(\d+)\(\$(\d+)\)$/);
        if (m) {
          const pname = m[1], qty = parseInt(m[2]), sub = parseInt(m[3]);
          if (!productMap[pname]) productMap[pname] = { qty: 0, amount: 0 };
          productMap[pname].qty += qty;
          productMap[pname].amount += sub;
        }
      });
    });

    const productList = Object.keys(productMap).map(k => ({
      name: k, qty: productMap[k].qty, amount: productMap[k].amount
    })).sort((a, b) => b.qty - a.qty);

    let html = '';

    // 最愛商品
    if (productList.length > 0) {
      html += '<div style="margin-bottom:16px;">';
      html += '<div style="font-size:12px;color:var(--ink3);margin-bottom:10px;font-weight:500;">購買商品排行</div>';
      html += '<table><thead><tr><th>商品</th><th class="right">數量</th><th class="right">金額</th></tr></thead><tbody>';
      productList.forEach(function(p, i) {
        const rc = i < 3 ? 'rank-'+(i+1) : '';
        html += '<tr><td><span class="rank ' + rc + '">' + (i+1) + '</span>' + p.name + '</td>';
        html += '<td class="right">' + p.qty + ' 盆</td>';
        html += '<td class="right amount">$' + p.amount.toLocaleString() + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }

    // 最近訂單（分批顯示）
    const PAGE = 10;
    let shownCount = PAGE;

    function renderOrders() {
      const tbody = document.getElementById('modal-orders-tbody');
      const btnWrap = document.getElementById('modal-load-more');
      if (!tbody) return;
      tbody.innerHTML = '';
      custOrders.slice(0, shownCount).forEach(function(o) {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td style="white-space:nowrap;">' + o.date.slice(0,10) + '</td>'
          + '<td style="font-size:12px;color:var(--ink2);">' + orderDetailHtml(o) + '</td>'
          + '<td class="right amount">$' + (o.totalAmount||0).toLocaleString() + '</td>';
        tbody.appendChild(tr);
      });
      if (btnWrap) {
        const remaining = custOrders.length - shownCount;
        if (remaining > 0) {
          btnWrap.style.display = 'block';
          btnWrap.querySelector('button').textContent = '載入更多（還有 ' + remaining + ' 筆）';
        } else {
          btnWrap.style.display = 'none';
        }
      }
    }

    html += '<div style="font-size:12px;color:var(--ink3);margin-bottom:10px;font-weight:500;">訂單紀錄（共 ' + custOrders.length + ' 筆）</div>';
    html += '<table><thead><tr><th>日期</th><th>明細</th><th class="right">金額</th></tr></thead><tbody id="modal-orders-tbody"></tbody></table>';
    html += '<div id="modal-load-more" style="display:none;text-align:center;padding:12px 0;">'
      + '<button onclick="(function(){window._custOrdersLoadMore&&window._custOrdersLoadMore();})()" '
      + 'style="padding:7px 20px;background:var(--green3);color:var(--green);border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:sans-serif;cursor:pointer;">載入更多</button></div>';

    document.getElementById('modal-cust-body').innerHTML = html;
    renderOrders();

    window._custOrdersLoadMore = function() {
      shownCount += PAGE;
      renderOrders();
    };
  } catch(e) {
    document.getElementById('modal-cust-body').innerHTML = '<div class="loading">載入失敗：' + e.message + '</div>';
  }
}

  if (e.target === document.getElementById('customer-modal')) {
    document.getElementById('customer-modal').classList.remove('open');
  }
}

let allOrdersCache = null;

async function getAllOrdersCached() {
  if (allOrdersCache) return allOrdersCache;
  const r = await fetch(API_URL + '?action=getAllOrders');
  const data = await r.json();
  if (!Array.isArray(data)) throw new Error('資料格式錯誤');
  allOrdersCache = data;
  return allOrdersCache;
}

async function searchCustomer() {
  const keyword = document.getElementById('cust-search-input').value.trim();
  const wrap = document.getElementById('cust-search-result');
  if (!keyword) {
    wrap.innerHTML = '<div class="search-hint">輸入姓名後搜尋，可查看該客戶歷史訂單與購買偏好</div>';
    return;
  }
  wrap.innerHTML = '<div class="search-hint dot-anim">搜尋中</div>';
  try {
    const orders = await getAllOrdersCached();
    const matched = {};
    orders.forEach(function(o) {
      if (o.customerName && o.customerName.includes(keyword)) {
        if (!matched[o.customerName]) {
          matched[o.customerName] = { count: 0, amount: 0, lastDate: '' };
        }
        matched[o.customerName].count++;
        matched[o.customerName].amount += (o.totalAmount || 0);
        const d = (o.date || '').slice(0,10);
        if (!matched[o.customerName].lastDate || d > matched[o.customerName].lastDate) {
          matched[o.customerName].lastDate = d;
        }
      }
    });
    const list = Object.keys(matched).map(function(name) {
      return { name: name, count: matched[name].count, amount: matched[name].amount, lastDate: matched[name].lastDate };
    }).sort(function(a, b) { return b.amount - a.amount; });

    if (!list.length) {
      wrap.innerHTML = '<div class="search-hint">查無「' + keyword + '」相符的客戶</div>';
      return;
    }
    let html = '<ul class="search-customer-list">';
    list.forEach(function(c) {
      html += '<li class="search-customer-item" onclick="showCustomerDetail(&quot;' + encodeURIComponent(c.name) + '&quot;,' + c.amount + ',' + c.count + ')">';
      html += '<div><div class="search-cust-name">' + c.name + '</div>';
      html += '<div class="search-cust-meta">訂單 ' + c.count + ' 筆　最後消費：' + (c.lastDate || '—') + '</div></div>';
      html += '<div class="search-cust-amount">$' + c.amount.toLocaleString() + '</div>';
      html += '</li>';
    });
    html += '</ul>';
    wrap.innerHTML = html;
  } catch(e) {
    wrap.innerHTML = '<div class="search-hint">搜尋失敗：' + e.message + '</div>';
  }
}

loadReport();
</script>
</body>
</html>
